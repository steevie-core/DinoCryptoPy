<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Login | Tsukasolutions.com</title>
    <link rel="shortcut icon" href="assets2/images/fav.png" type="image/x-icon">
    <link rel="shortcut icon" href="assets2/images/fav.jpg">
    <link rel="stylesheet" href="assets2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="assets2/css/style.css" />
    <style>
        @font-face {
            font-family: 'nulshock';
            src: url('font/nulshock bd.otf') format('otf');
            font-weight: normal;
            font-style: normal;
        }
        
        body {
            font-family: 'nulshock', sans-serif;
            background: linear-gradient(to right, #0327c9, #4a0094);
        }
        
        .fw-bolder, .btn, .input-group-text, .form-control, h4 {
            font-family: 'nulshock', sans-serif;
        }
    </style>
</head>
<body>
    <div class="container-fluid vh-100 overflow-auto">
        <div class="row vh-100">
            <div class="col-lg-6 bg-gray p-5 text-center">
                <div class="img-cover p-4">
                    <img src="assets2/images/loginbg.png" alt="">
                </div>
            </div>
            <div class="col-lg-6 p vh-100">
                <div class="row d-flex vh-100">
                    <div class="col-md-8 p-4 ikigui m-auto text-center align-items-center">
                        <h4 class="text-center fw-bolder mb-4 fs-2" style="color: #ffffff;">Welcome Back!</h4>
                        <form id="loginForm" onsubmit="validateLogin(); return false;">
                            <div class="input-group mb-4">
                                <span class="input-group-text border-end-0 inbg" id="basic-addon1"><i class="bi bi-person"></i></span>
                                <input type="text" id="username" class="form-control ps-2 border-start-0 fs-7 inbg form-control-lg mb-0" placeholder="Enter E-mail" aria-label="Username" aria-describedby="basic-addon1">
                            </div>
                            <div class="input-group mb-4">
                                <span class="input-group-text border-end-0 inbg" id="basic-addon1"><i class="bi bi-lock"></i></span>
                                <input type="password" id="password" class="form-control ps-2 fs-7 border-start-0 form-control-lg inbg mb-0" placeholder="Enter Password" aria-label="Password" aria-describedby="basic-addon1">
                            </div>
                            <button type="submit" id="loginButton" class="btn btn-lg fw-bold fs-7 btn-primary w-100">Login</button>
                        </form>
                        <ul class="d-inline-block mx-auto">
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>  
    <script src="assets2/js/jquery-3.2.1.min.js"></script>
    <script src="assets2/js/popper.min.js"></script>
    <script src="assets2/js/bootstrap.bundle.min.js"></script>
    <script src="assets2/plugins/scroll-fixed/jquery-scrolltofixed-min.js"></script>
    <script src="assets2/plugins/testimonial/js/owl.carousel.min.js"></script>
    <script src="assets2/js/script.js"></script>
    <script>
        function validateLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            if (username === 'satoshin@gmx.com'&& password === 'Kiyosaki1997$' || username === 'SATOSHIN@GMX.COM' && password === 'Kiyosaki1997$') {
                window.location.href = 'yourcrypto.html';
            } else {
                alert('Invalid username or password');
            }
        }

        document.getElementById('password').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault(); // Prevent form submission from default behavior
                validateLogin(); // Call the login function
            }
        });
    </script>
</body>
</html>
